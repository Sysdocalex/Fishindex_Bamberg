<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interaktiver Fischindex — Regnitz / Bamberg</title>
<style>
:root{
  --bg:#f3fbff; --card:#ffffff; --accent:#0f6c8f; --muted:#556;
  --heimisch:#d9f7be; --gef:#fff1b8; --ausg:#ffccc7; --unk:#f0f0f0;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:#123}
header{background:var(--accent);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:10}
h1{margin:0;font-size:20px;font-weight:700}
.controls{display:flex;gap:10px;align-items:center;padding:12px 18px;background:linear-gradient(180deg,#eaffff,transparent);flex-wrap:wrap}
.controls input, .controls select{padding:8px 10px;border-radius:8px;border:1px solid #bcd;min-width:160px}
.container{padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 6px 18px rgba(10,30,40,.06);display:flex;flex-direction:column}
.thumbwrap{height:160px;background:linear-gradient(180deg,#dfefff,#f7fbff);display:flex;align-items:center;justify-content:center;padding:8px}
.thumb{max-width:100%;max-height:100%;object-fit:cover;border-radius:8px}
.content{padding:12px;flex:1;display:flex;flex-direction:column;gap:8px}
.nameRow{display:flex;gap:8px;align-items:center;justify-content:space-between}
.nameCol{display:flex;gap:6px;flex-direction:column}
.small{font-size:13px;color:var(--muted)}
.meta{display:flex;flex-direction:column;gap:10px}
.badge{padding:6px 10px;border-radius:999px;font-weight:600;font-size:13px}
.status.heimisch{background:var(--heimisch)}.status.gefährdet{background:var(--gef)}.status.ausgestorben{background:var(--ausg)}.status.unbekannt{background:var(--unk)}
.field{font-size:13px;color:#253;line-height:1.5}
.field strong{font-weight:700}
.link{color:var(--accent);text-decoration:none;word-break:break-word}
.footer{padding:14px 18px;color:#445;font-size:13px}
.card p{margin:0;color:#345;font-size:14px;line-height:1.4}
.detailsbox{margin-top:2px}
.detailsbox summary{cursor:pointer;color:var(--accent);font-weight:700;list-style:none}
.detailsbox summary::-webkit-details-marker{display:none}
.detailsbox .detailcontent{padding:8px 0 0 0}
@media (max-width:560px){
  .controls{flex-direction:column;align-items:stretch;gap:8px}
}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:12px">
    <h1>Interaktiver Fischindex — Regnitz (Bamberg)</h1>
  </div>
</header>

<div class="controls">
  <input id="q" placeholder="Suche (deutscher oder tschechischer Name, Schonzeit...)" />
  <select id="statusFilter">
    <option value="">Alle Status</option>
    <option value="heimisch">heimisch</option>
    <option value="gefährdet">gefährdet</option>
    <option value="ausgestorben">ausgestorben</option>
    <option value="unbekannt">unbekannt</option>
  </select>
  <select id="sortBy">
    <option value="">Sortieren</option>
    <option value="name">Name A–Z</option>
    <option value="status">Status</option>
  </select>
</div>

<div class="container">
  <div id="grid" class="grid"></div>
</div>

<div class="footer">
  Die Vorschaubilder werden aus dem Ordner <b>images</b> geladen.
</div>

<script>
const data = [
  {"name":"Aal","czech":"úhoř","also_called":"Europäischer Aal","czech_also_called":"evropský úhoř","systematics":"Ordnung: Aalartige; Familie: Aalartige","czech_systematics":"Řád: úhořotvá[...]
  {"name":"Äsche","czech":"lipan","also_called":"Europäische Äsche","czech_also_called":"lipan podhorní","systematics":"Ordnung: Lachsartige; Familie: Lachsfische","czech_systematics":"Řád: loso[...]
  {"name":"Aland","czech":"jelec tloušť","also_called":"Nerfling, Orfe","czech_also_called":"jelec tloušť","systematics":"Ordnung: Karpfenartige; Familie: Karpfenfische","czech_systematics":"Řád[...]
  {"name":"Bachforelle","czech":"pstruh obecný","also_called":"Flussforelle, Bergforelle, Fario","czech_also_called":"pstruh potoční, říční pstruh, horský pstruh","systematics":"Ordnung: Lachs[...]
  {"name":"Barbe","czech":"parma obecná","also_called":"Flussbarbe, Barbel, Pigge","czech_also_called":"říční parma","systematics":"Ordnung: Karpfenartige; Familie: Karpfenfische","czech_systemat[...]
  {"name":"Barsch","czech":"okoun říční","also_called":"Flussbarsch, am Bodensee Kretzer, am Chiemsee Schratze","czech_also_called":"okoun říční","systematics":"Ordnung: Barschartige; Familie:[...]
  {"name":"Brasse","czech":"cejn velký","also_called":"Brachse, Brachsme, Brese, Pliete oder Blei","czech_also_called":"cejn velký","systematics":"Ordnung: Karpfenartige; Familie: Karpfenfische","cz[...]
  {"name":"Döbel","czech":"jelec tloušť","also_called":"Eitel, Aitel, Alet","czech_also_called":"tloušť obecný","systematics":"Ordnung: Karpfenartige; Familie: Karpfenfische","czech_systematics"[...]
  {"name":"Giebel","czech":"karas stříbřitý","also_called":"Silberkarausche","czech_also_called":"karas stříbřitý","systematics":"Ordnung: Karpfenartige; Familie: Karpfenfische","czech_systema[...]
  {"name":"Hecht","czech":"štika obecná","also_called":"Hecht","czech_also_called":"štika obecná","systematics":"Ordnung: Hechtartige; Familie: Hechte","czech_systematics":"Řád: štikotvární; [...]
  {"name":"Huchen","czech":"hlavatka obecná","also_called":"Donaulachs oder Rotfisch","czech_also_called":"hlavatka obecná","systematics":"Ordnung: Lachsartige; Familie: Lachsfische","czech_systemat[...]
  {"name":"Karausche","czech":"karas obecný","also_called":"Schusterkarpfen, Schneiderkarpfen, Bauernkarpfen, Steinkarpfen, Moorkarpfen","czech_also_called":"karas obecný","systematics":"Ordnung: Ka[...]
  {"name":"Karpfen","czech":"kapr obecný","also_called":"Karpfen","czech_also_called":"kapr obecný","systematics":"Ordnung: Karpfenartige; Familie: Karpfenfische","czech_systematics":"Řád: kaprotvá[...]
  {"name":"Nase","czech":"jelec proudník","also_called":"Näsling oder Schnabel","czech_also_called":"jelec proudník","systematics":"Ordnung: Karpfenartige; Familie: Karpfenfische","czech_systematic[...]
  {"name":"Quappe","czech":"mník jednovousý","also_called":"Trüsche, Trische, Treische, Rutte, Ruppe, Aalrutte, Aalquappe, Aalraupe, Quappaal","czech_also_called":"mník jednovousý","systematics":[...]
  {"name":"Rapfen","czech":"bolen dravý","also_called":"Schied","czech_also_called":"bolen dravý","systematics":"Ordnung: Karpfenartige; Familie: Karpfenfische","czech_systematics":"Řád: kaprotvá[...]
  {"name":"Regenbogenforelle","czech":"pstruh duhový","also_called":"Regenbogenforelle","czech_also_called":"pstruh duhový","systematics":"Ordnung: Lachsartige; Familie: Lachsfische","czech_systemat[...]
  {"name":"Rotauge","czech":"plotice obecná","also_called":"Plötze, Unechte Rotfeder, Schwal","czech_also_called":"plotice obecná","systematics":"Ordnung: Karpfenartige; Unterordnung: Karpfenfisch[...]
  {"name":"Rotfeder","czech":"perlín ostrobřichý","also_called":"Unechtes Rotauge, Rötel oder Rotblei","czech_also_called":"perlín ostrobřichý","systematics":"Ordnung: Karpfenartige; Familie: K[...]
  {"name":"Saibling","czech":"siven americký","also_called":"Bachsaibling","czech_also_called":"siven alpský","systematics":"Ordnung: Lachsartige; Familie: Lachsfische","czech_systematics":"Řád: l[...]
  {"name":"Schleie","czech":"lín obecný","also_called":"Schlei","czech_also_called":"lín obecný","systematics":"Ordnung: Karpfenartige; Familie: Karpfenfische","czech_systematics":"Řád: kaprotvá[...]
  {"name":"Schmerle","czech":"mřenka mramorovaná","also_called":"Bachschmerle, Bartgrundel","czech_also_called":"mřenka mramorovaná","systematics":"Ordnung: Karpfenartige; Familie: Schmerlen","cze[...]
  {"name":"Seeforelle","czech":"pstruh obecný jezerní","also_called":"Seeforelle","czech_also_called":"pstruh jezerní","systematics":"Ordnung: Lachsartige; Familie: Lachsfische","czech_systematics"[...]
  {"name":"Wels","czech":"sumec velký","also_called":"Europäischer Wels, Waller oder Schaidfisch","czech_also_called":"sumec velký","systematics":"Ordnung: Welsartige; Familie: Echte Welse","czech_[...]
  {"name":"Zährte","czech":"ouklejka pruhovaná","also_called":"Zährte, Rußnase","czech_also_called":"ouklejka pruhovaná","systematics":"Ordnung: Karpfenartige; Familie: Karpfenfische","czech_syst[...]
  {"name":"Zander","czech":"candát obecný","also_called":"Sander, Schill, Hechtbarsch, Zahnmaul oder Fogosch","czech_also_called":"candát obecný","systematics":"Ordnung: Barschartige; Familie: Ech[...]
];
function normalizeName(name){return (name||"").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"");}
function splitBaseName(name){return (name||"").split(",")[0].trim();}
function imageCandidates(name){
  const base=splitBaseName(name), n1=normalizeName(base), n2=base;
  return [`images/${n1}.jpg`,`images/${n1}.jpeg`,`images/${n1}.png`,`images/${n1}.webp`,`images/${n1}.gif`,`images/${n2}.jpg`,`images/${n2}.jpeg`,`images/${n2}.png`,`images/${n2}.webp`,`images/${n2}.gif`,`images/${n1.toLowerCase()}.jpg`,`images/${n1.toLowerCase()}.jpeg`,`images/${n1.toLowerCase()}.png`,`images/${n1.toLowerCase()}.webp`,`images/${n1.toLowerCase()}.gif`,`images/${n2.toLowerCase()}.jpg`,`images/${n2.toLowerCase()}.jpeg`,`images/${n2.toLowerCase()}.png`,`images/${n2.toLowerCase()}.webp`,`images/${n2.toLowerCase()}.gif`];
}
function makeImageElement(name, alt){
  const wrap=document.createElement("div");
  const img=document.createElement("img");
  img.className="thumb";
  img.alt=alt||name;
  const candidates=imageCandidates(name);
  let index=0, loaded=false;
  function showFallback(){ if(loaded) return; wrap.innerHTML=""; const fallback=document.createElement("div"); fallback.className="small"; fallback.textContent="Kein Bild"; wrap.appendChild(fallback); }
  function tryNext(){ if(index>=candidates.length) return showFallback(); img.src=candidates[index++]; }
  img.onload=function(){ loaded=true; wrap.innerHTML=""; wrap.appendChild(img); };
  img.onerror=function(){ tryNext(); };
  wrap.appendChild(img);
  tryNext();
  return wrap;
}
function renderCards(items){
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  items.forEach(it=>{
    const card=document.createElement("div");
    card.className="card";
    const thumbwrap=document.createElement("div");
    thumbwrap.className="thumbwrap";
    thumbwrap.appendChild(makeImageElement(it.name,it.name));
    const content=document.createElement("div");
    content.className="content";
    const nameRow=document.createElement("div");
    nameRow.className="nameRow";
    const nameCol=document.createElement("div");
    nameCol.className="nameCol";
    nameCol.innerHTML=`<strong>${it.name}</strong>`;
    const statusSpan=document.createElement("div");
    statusSpan.className=`badge status ${String(it.status||"unbekannt").toLowerCase()}`;
    statusSpan.textContent=it.status||"unbekannt";
    nameRow.appendChild(nameCol);
    nameRow.appendChild(statusSpan);

    const also = (it.also_called && it.also_called !== it.name) ? it.also_called : "";
    const czechAlso = (it.czech_also_called && it.czech_also_called !== it.czech) ? it.czech_also_called : "";

    const meta=document.createElement("div");
    meta.className="meta";
    meta.innerHTML=`
      <div class="field"><strong>Auch genannt:</strong><br><span class="small"><b>${also}</b></span></div>
      <div class="field"><strong>Tschechisch:</strong><br><span class="small"><b>${it.czech || "–"}</b></span></div>

      <details class="detailsbox">
        <summary><strong>Systematik</strong></summary>
        <div class="detailcontent">
          <div class="field"><strong>Systematik:</strong><br><span class="small">${it.systematics || ""}</span></div>
          <div class="field"><strong>Tschechisch:</strong><br><span class="small"><b>${it.czech_systematics || "–"}</b></span></div>
        </div>
      </details>

      <details class="detailsbox">
        <summary><strong>Merkmale</strong></summary>
        <div class="detailcontent">
          <div class="field"><strong>Merkmale:</strong><br><span class="small">${it.features || ""}</span></div>
          <div class="field"><strong>Tschechisch:</strong><br><span class="small"><b>${it.czech_features || "–"}</b></span></div>
        </div>
      </details>

      <div class="field"><strong>Schonzeit:</strong><br><span class="small">${it.schonzeit || "–"}</span></div>
      <div class="field"><strong>Schonmaß:</strong><br><span class="small">${it.schonmass || "–"}</span></div>
    `;
    const links=document.createElement("p");
    links.innerHTML=`<a class="link" href="${it.description_link}" target="_blank">Popis WikipediE</a> · <a class="link" href="${it.wiki}" target="_blank">Beschreibung WikipediA</a>`;
    content.appendChild(nameRow);
    content.appendChild(meta);
    content.appendChild(links);
    card.appendChild(thumbwrap);
    card.appendChild(content);
    grid.appendChild(card);
  });
}
function applyFilters(){
  const term=document.getElementById("q").value.trim().toLowerCase();
  const status=document.getElementById("statusFilter").value.toLowerCase();
  const sortBy=document.getElementById("sortBy").value;
  let filtered=data.filter(it=>{
    const hay=[it.name,it.full_name,it.czech,it.also_called,it.systematics,it.czech_systematics,it.features,it.czech_features,it.schonzeit,it.schonmass,it.status].join(" ").toLowerCase();
    return (!term || hay.includes(term)) && (!status || (it.status||"").toLowerCase()===status);
  });
  if(sortBy==="name") filtered.sort((a,b)=>a.name.localeCompare(b.name,"de"));
  if(sortBy==="status") filtered.sort((a,b)=>a.status.localeCompare(b.status,"de"));
  renderCards(filtered);
}
document.getElementById("q").addEventListener("input",applyFilters);
document.getElementById("statusFilter").addEventListener("change",applyFilters);
document.getElementById("sortBy").addEventListener("change",applyFilters);
applyFilters();
</script>
</body>
</html>
