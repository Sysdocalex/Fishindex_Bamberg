<style>
:root{

}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:#123}
header{background:var(--accent);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:10}
h1{margin:0;font-size:20px;font-weight:700}
.controls{display:flex;gap:10px;align-items:center;padding:12px 18px;background:linear-gradient(180deg,#eaffff,transparent);flex-wrap:wrap}
.controls input, .controls select{padding:8px 10px;border-radius:8px;border:1px solid #bcd;min-width:160px}
.container{padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 6px 18px rgba(10,30,40,.06);display:flex;flex-direction:column}
.thumbwrap{height:160px;background:linear-gradient(180deg,#dfefff,#f7fbff);display:flex;align-items:center;justify-content:center;padding:8px}
.thumb{max-width:100%;max-height:100%;object-fit:cover;border-radius:8px}
.content{padding:12px;flex:1;display:flex;flex-direction:column;gap:8px}
.nameRow{display:flex;gap:8px;align-items:center;justify-content:space-between}
.nameCol{display:flex;gap:6px;flex-direction:column}
.small{font-size:13px;color:var(--muted)}
.meta{display:flex;flex-direction:column;gap:10px}
.badge{padding:6px 10px;border-radius:999px;font-weight:600;font-size:13px}
.status.heimisch{background:var(--heimisch)}.status.gefährdet{background:var(--gef)}.status.ausgestorben{background:var(--ausg)}.status.unbekannt{background:var(--unk)}
.field{font-size:13px;color:#253;line-height:1.5}
.field strong{font-weight:700}
.link{color:var(--accent);text-decoration:none;word-break:break-word}
.footer{padding:14px 18px;color:#445;font-size:13px}
.card p{margin:0;color:#345;font-size:14px;line-height:1.4}
.detailsbox{margin-top:2px}
.detailsbox summary{cursor:pointer;color:var(--accent);font-weight:700;list-style:none}
.detailsbox summary::-webkit-details-marker{display:none}
.detailsbox .detailcontent{padding:8px 0 0 0}
@media (max-width:560px){
  .controls{flex-direction:column;align-items:stretch;gap:8px}
}
</style>
</head>

</div>

<div class="container">

</div>

<div class="footer">

function normalizeName(name){return (name||"").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"");}
function splitBaseName(name){return (name||"").split(",")[0].trim();}
function imageCandidates(name){
  const base=splitBaseName(name), n1=normalizeName(base), n2=base;
  return [`Images/${n1}.jpg`,`Images/${n1}.jpeg`,`Images/${n1}.png`,`Images/${n1}.webp`,`Images/${n1}.gif`,`Images/${n2}.jpg`,`Images/${n2}.jpeg`,`Images/${n2}.png`,`Images/${n2}.webp`,`Images/${n2}.gif`];
}
function makeImageElement(name, alt){
  const wrap=document.createElement("div");
  const img=document.createElement("img");
  img.className="thumb";
  img.alt=alt||name;
  const candidates=imageCandidates(name);
  let index=0, loaded=false;
  function showFallback(){ if(loaded) return; wrap.innerHTML=""; const fallback=document.createElement("div"); fallback.className="small"; fallback.textContent="Kein Bild"; wrap.appendChild(fallback); }
  function tryNext(){ if(index>=candidates.length) return showFallback(); img.src=candidates[index++]; }
  img.onload=function(){ loaded=true; wrap.innerHTML=""; wrap.appendChild(img); };
  img.onerror=function(){ tryNext(); };
  wrap.appendChild(img);
  tryNext();
  return wrap;
}
function renderCards(items){
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  items.forEach(it=>{
    const card=document.createElement("div");
    card.className="card";
    const thumbwrap=document.createElement("div");
    thumbwrap.className="thumbwrap";
    thumbwrap.appendChild(makeImageElement(it.name,it.name));
    const content=document.createElement("div");
    content.className="content";
    const nameRow=document.createElement("div");
    nameRow.className="nameRow";
    const nameCol=document.createElement("div");
    nameCol.className="nameCol";
    nameCol.innerHTML=`<strong>${it.name}</strong>`;
    const statusSpan=document.createElement("div");
    statusSpan.className=`badge status ${String(it.status||"unbekannt").toLowerCase()}`;
    statusSpan.textContent=it.status||"unbekannt";
    nameRow.appendChild(nameCol);
    nameRow.appendChild(statusSpan);

    const also = (it.also_called && it.also_called !== it.name) ? it.also_called : "";
    const czechAlso = (it.czech_also_called && it.czech_also_called !== it.czech) ? it.czech_also_called : "";

    const meta=document.createElement("div");
    meta.className="meta";
    meta.innerHTML=`
      <div class="field"><strong>Auch genannt:</strong><br><span class="small"><b>${also}</b></span></div>
      <div class="field"><strong>Tschechisch:</strong><br><span class="small"><b>${it.czech || "–"}</b></span></div>

      <details class="detailsbox">
        <summary><strong>Systematik</strong></summary>
        <div class="detailcontent">
          <div class="field"><strong>Systematik:</strong><br><span class="small">${it.systematics || ""}</span></div>
          <div class="field"><strong>Tschechisch:</strong><br><span class="small"><b>${it.czech_systematics || "–"}</b></span></div>
        </div>
      </details>

      <details class="detailsbox">
        <summary><strong>Merkmale</strong></summary>
        <div class="detailcontent">
          <div class="field"><strong>Merkmale:</strong><br><span class="small">${it.features || ""}</span></div>
          <div class="field"><strong>Tschechisch:</strong><br><span class="small"><b>${it.czech_features || "–"}</b></span></div>
        </div>
      </details>

      <div class="field"><strong>Schonzeit:</strong><br><span class="small">${it.schonzeit || "–"}</span></div>
      <div class="field"><strong>Schonmaß:</strong><br><span class="small">${it.schonmass || "–"}</span></div>
    `;
    const links=document.createElement("p");
    links.innerHTML=`<a class="link" href="${it.description_link}" target="_blank">Popis WikipediE</a> · <a class="link" href="${it.wiki}" target="_blank">Beschreibung WikipediA</a>`;
    content.appendChild(nameRow);
    content.appendChild(meta);
    content.appendChild(links);
    card.appendChild(thumbwrap);
    card.appendChild(content);
    grid.appendChild(card);
  });
}
function applyFilters(){
  const term=document.getElementById("q").value.trim().toLowerCase();
  const status=document.getElementById("statusFilter").value.toLowerCase();
  const sortBy=document.getElementById("sortBy").value;
  let filtered=data.filter(it=>{
    const hay=[it.name,it.full_name,it.czech,it.also_called,it.systematics,it.czech_systematics,it.features,it.czech_features,it.schonzeit,it.schonmass,it.status].join(" ").toLowerCase();
    return (!term || hay.includes(term)) && (!status || (it.status||"").toLowerCase()===status);
  });
  if(sortBy==="name") filtered.sort((a,b)=>a.name.localeCompare(b.name,"de"));
  if(sortBy==="status") filtered.sort((a,b)=>a.status.localeCompare(b.status,"de"));
  renderCards(filtered);
}
document.getElementById("q").addEventListener("input",applyFilters);
document.getElementById("statusFilter").addEventListener("change",applyFilters);
document.getElementById("sortBy").addEventListener("change",applyFilters);
applyFilters();
</script>
</body>
